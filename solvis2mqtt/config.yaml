name: solvis2mqtt
version: "1.0.1"
slug: solvis2mqtt
description: "Solvis-Heizungsanlagen (SolvisControl 2 mit SolvisRemote) per MQTT in Home Assistant"
url: https://github.com/lufi42/hassio-addons/tree/main/solvis2mqtt
arch:
  - aarch64
  - amd64
# Multi-arch image built by .github/workflows/build.yml; the tag is the version above.
# Comment out to build the image locally on the Home Assistant host.
image: ghcr.io/lufi42/hassio-addon-solvis2mqtt
startup: application
boot: auto
# The image has no s6 overlay; Docker's init forwards SIGTERM to the server.
init: true
services:
  - mqtt:want
map:
  # /config inside the container (host: addon_configs/<id>_solvis2mqtt), for an own
  # base.xml and overrides of ha-labels.properties, ha-groups.properties, tinylog.properties.
  - type: app_config
    read_only: false
options:
  solvis_user: "solvis"
  unit_id: "SolvisMax"
  unit_type: "SolvisMax6"
  main_heating: "OelBW"
  heating_circuits: 1
  extensions: []
  remote_firmware_old: false
  gui_access: true
  clock_tuning: true
  admin: false
  topic_prefix: "solvis2mqtt"
  discovery_prefix: "homeassistant"
  java_heap_mb: 384
schema:
  # Host, user and password are checked by run.sh; they may stay empty with an own base.xml.
  solvis_host: "match(^[A-Za-z0-9.-]+(:[0-9]+)?$)?"
  solvis_user: "str?"
  solvis_password: "password?"
  unit_id: "match(^[A-Za-z0-9_]+$)"
  unit_type: "list(SolvisMax6|SolvisMax6PurSolo|SolvisMax7)"
  main_heating: "list(OelBW|OelNT|Gas|Fern|WaermeP|Extern|Pellet)"
  heating_circuits: "int(1,3)"
  extensions:
    - "list(OhneRaumfuehler_HK1|OhneRaumfuehler_HK2|OhneRaumfuehler_HK3|Festbrennstoff|SolarOstWest|Zaehlfunktion2Screens)"
  remote_firmware_old: bool
  gui_access: bool
  clock_tuning: bool
  admin: bool
  mqtt_host: "str?"
  mqtt_port: "port?"
  mqtt_user: "str?"
  mqtt_password: "password?"
  topic_prefix: "match(^[A-Za-z0-9]+$)"
  discovery_prefix: "match(^[A-Za-z0-9_-]+$)"
  time_zone: "str?"
  java_heap_mb: "int(256,2048)"
